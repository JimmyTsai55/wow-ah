[project]
name = "wow-ah"
version = "0.1.0"
description = "WoW Auction House arbitrage analysis tool"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "pydantic-settings>=2.7",
    "tabulate>=0.9",
    "openai>=1.60",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[project.scripts]
wow-ah = "wow_ah.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_ah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
